# Local development infrastructure. Applications are not here yet — they arrive with their own
# Dockerfiles as they're built.
#
# Local only. Mailpit and the telemetry dashboard must never be reachable from a hosted
# environment: mail silently going nowhere while every send reports success is worse than an
# outage. A deployed stack gets its own compose file if it ever uses one (D12 is still open).
#
#   scripts/dev up            postgres + rabbitmq + mailpit (plain `docker compose up -d` works
#   scripts/dev up --otel     also the telemetry dashboard    too and assumes the defaults)
#
# Host ports are env-overridable so isolated stacks can run side by side: `scripts/dev init <n>`
# writes the per-instance .env, and docs/local-dev.md is the whole story. Containers, network
# and volumes are namespaced per COMPOSE_PROJECT_NAME; only host ports can clash.
name: mystack

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mystack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystack}
      POSTGRES_DB: ${POSTGRES_DB:-mystack}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    # Postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker and the image's VOLUME to the
    # parent — mounting the old /var/lib/postgresql/data path here would silently not persist.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mystack} -d ${POSTGRES_DB:-mystack}']
      interval: 5s
      timeout: 3s
      retries: 10

  # The message broker MyStack.Messaging speaks to (docs/architecture.md §3.3). The management
  # UI (default http://localhost:15672, guest/guest) is the queue operator's view: depths, rates,
  # and the wolverine-dead-letter-queue with its parked messages.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    # Cookies are per-host, not per-port, so the browser sends every localhost app's cookies to
    # the management UI too — and ASP.NET Core's chunked auth cookies alone overflow Cowboy's
    # 4KB-per-header default, which answers 431. Local-only UI; a bigger budget costs nothing.
    configs:
      - source: rabbitmq-advanced
        target: /etc/rabbitmq/advanced.config
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # The inbox every environment's email actually lands in locally — there is no dev-only sender.
  # UI defaults to http://localhost:8025; the e2e suite reads the same messages over its REST API.
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  # OTLP receiver + UI for traces, metrics and logs. Named for the role, not the image: the apps
  # only ever speak OTLP, so swapping in a different backend is a one-line change here. Opt-in
  # (`--profile otel`), and anonymous because it is local-only — see docs/architecture.md D1.
  otel-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    profiles: [otel]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'true'
    ports:
      - '${OTEL_DASHBOARD_UI_PORT:-18888}:18888' # web UI
      - '${OTEL_DASHBOARD_OTLP_PORT:-18889}:18889' # OTLP ingest (gRPC)

volumes:
  postgres-data:

configs:
  rabbitmq-advanced:
    content: |
      [{rabbitmq_management, [{tcp_config, [{cowboy_opts, [{max_header_value_length, 32768}]}]}]}].
