name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single required check. An e2e job (which builds container images) stays separate from it.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # Central Package Management keeps the versions in one file, but which packages each
          # project asks for still lives in its csproj — both belong in the restore key.
          cache: true
          cache-dependency-path: |
            server/Directory.Packages.props
            server/**/*.csproj

      - name: Validate compose file
        run: docker compose config --quiet

      # The JavaScript half runs first: it finishes in seconds, the .NET half in minutes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: JS format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - run: dotnet tool restore

      - name: Format check
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build server/MyStack.slnx --configuration Release

      - name: Test
        run: dotnet test server/MyStack.slnx --configuration Release
